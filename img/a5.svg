<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="840" height="430" fill="#fff"/><text x="30" y="34" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#1c1f2e" text-anchor="start">ИИ помогает учиться, а не учится за тебя</text><rect x="30" y="54" width="380" height="300" rx="14" fill="#fff" stroke="#d94848" stroke-width="3"/><rect x="50" y="80" width="340" height="64" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="64" y="106" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Напиши за меня сочинение</text><text x="64" y="126" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">про осень, я сдам</text><rect x="50" y="160" width="340" height="100" rx="10" fill="#fdeeee" stroke="#d94848" stroke-width="2"/><text x="70" y="190" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">Учитель просит твои мысли,</text><text x="70" y="212" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">а не чужой текст.</text><text x="70" y="240" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#d94848" text-anchor="start">Списал — не научился.</text><text x="70" y="292" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d94848" text-anchor="start">😕 На контрольной ИИ рядом</text><text x="70" y="316" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d94848" text-anchor="start">не будет.</text><rect x="430" y="54" width="380" height="300" rx="14" fill="#fff" stroke="#16a34a" stroke-width="3"/><rect x="450" y="80" width="340" height="64" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="464" y="106" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Не решай за меня. Объясни,</text><text x="464" y="126" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">как решать такие задачи</text><rect x="450" y="160" width="340" height="100" rx="10" fill="#f4fbf6" stroke="#16a34a" stroke-width="2"/><text x="470" y="190" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">Объясни, приведи пример,</text><text x="470" y="212" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">найди мою ошибку,</text><text x="470" y="234" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">придумай задачи для тренировки.</text><text x="470" y="292" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#16a34a" text-anchor="start">⭐ Понял сам — умеешь сам.</text><text x="30" y="390" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a8f9e" text-anchor="start">Пользовался ИИ для домашки — скажи об этом взрослым или учителю. Это честно.</text></svg>