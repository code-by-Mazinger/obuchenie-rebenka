<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="840" height="430" fill="#fff"/><text x="30" y="34" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#1c1f2e" text-anchor="start">Один и тот же вопрос — разные ответы</text><rect x="30" y="50" width="380" height="330" rx="14" fill="#fff" stroke="#d94848" stroke-width="3"/><text x="50" y="82" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#d94848" text-anchor="start">✕ Слишком общая просьба</text><rect x="50" y="96" width="340" height="42" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="64" y="122" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Расскажи про Марс</text><rect x="50" y="150" width="340" height="210" rx="10" fill="#f7f7fb" stroke="#dfe3ee" stroke-width="2"/><text x="66" y="180" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">Марс — четвёртая планета от Солнца.</text><text x="66" y="202" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">Он имеет красноватый оттенок из-за</text><text x="66" y="224" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">оксида железа в грунте. Атмосфера</text><text x="66" y="246" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">разрежена и состоит в основном из</text><text x="66" y="268" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">углекислого газа. Период обращения…</text><text x="66" y="330" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#d94848" text-anchor="start">Длинно, непонятно, не для доклада</text><rect x="430" y="50" width="380" height="330" rx="14" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="450" y="82" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#16a34a" text-anchor="start">✓ Точная просьба</text><rect x="450" y="96" width="340" height="76" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="464" y="122" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Я в 4 классе. Дай 5 фактов о Марсе</text><text x="464" y="142" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">для доклада, списком, простыми</text><text x="464" y="162" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">словами, по одной строке</text><rect x="450" y="184" width="340" height="176" rx="10" fill="#f4fbf6" stroke="#cfe9d8" stroke-width="2"/><text x="466" y="212" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">1. Марс — четвёртая планета от Солнца.</text><text x="466" y="236" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">2. Его называют Красной планетой.</text><text x="466" y="260" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">3. Там есть самая высокая гора.</text><text x="466" y="284" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">4. Сутки почти как на Земле.</text><text x="466" y="308" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">5. Воды в виде льда — на полюсах.</text><text x="30" y="410" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a8f9e" text-anchor="start">Скажи: кто ты, зачем нужно, сколько пунктов и каким должен быть ответ.</text></svg>