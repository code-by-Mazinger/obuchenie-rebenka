<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="800" height="480" fill="#fff"/><rect x="20" y="40" width="480" height="330" rx="12" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><path d="M32 40 h456 a12 12 0 0 1 12 12 v22 h-480 v-22 a12 12 0 0 1 12 -12z" fill="#2f6df6"/><line x1="20" y1="74" x2="500" y2="74" stroke="#1c1f2e" stroke-width="2" stroke-linecap="round"/><text x="34" y="63" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Блокнот — без имени</text><text x="422" y="63" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">—</text><text x="450" y="63" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">▢</text><text x="478" y="63" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="44" y="110" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#1c1f2e" text-anchor="start">Привет! Это моё первое окно.</text><line x1="44" y1="130" x2="260" y2="130" stroke="#8a8f9e" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="250" cy="57" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="250" y="62" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">1</text><text x="250" y="20" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="middle">Заголовок: держи и тащи, чтобы двигать окно</text><line x1="422" y1="70" x2="525" y2="110" stroke="#1c1f2e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="540" cy="110" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="115" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">2</text><text x="562" y="115" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">— свернуть на панель задач</text><line x1="450" y1="70" x2="525" y2="150" stroke="#1c1f2e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="540" cy="150" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="155" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">3</text><text x="562" y="155" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">▢ на весь экран / обратно</text><line x1="478" y1="70" x2="525" y2="190" stroke="#1c1f2e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="540" cy="190" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="195" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">4</text><text x="562" y="195" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">✕ закрыть программу</text><path d="M484 354 l14 14" stroke="#1c1f2e" stroke-width="3" stroke-linecap="round"/><circle cx="540" cy="330" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="335" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">5</text><text x="562" y="335" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Край окна: тяни,</text><text x="562" y="352" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">чтобы менять размер</text><rect x="0" y="430" width="800" height="50" rx="0" fill="#e9eef7" stroke="#1c1f2e" stroke-width="2"/><rect x="18" y="440" width="30" height="30" rx="6" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><rect x="24" y="446" width="8" height="8" rx="0" fill="#2f6df6" stroke="none" stroke-width="0"/><rect x="34" y="446" width="8" height="8" rx="0" fill="#2f6df6" stroke="none" stroke-width="0"/><rect x="24" y="456" width="8" height="8" rx="0" fill="#2f6df6" stroke="none" stroke-width="0"/><rect x="34" y="456" width="8" height="8" rx="0" fill="#2f6df6" stroke="none" stroke-width="0"/><rect x="70" y="440" width="30" height="30" rx="6" fill="#2f6df6" stroke="#1c1f2e" stroke-width="2"/><line x1="66" y1="474" x2="104" y2="474" stroke="#2f6df6" stroke-width="4" stroke-linecap="round"/><rect x="112" y="440" width="30" height="30" rx="6" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><text x="160" y="460" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">← свёрнутое окно живёт здесь, кликни — вернётся</text></svg>