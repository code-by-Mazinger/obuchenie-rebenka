-width="2"/><text x="60" y="415" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">3</text><rect x="84" y="395" width="40" height="30" rx="7" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><line x1="86" y1="424" x2="122" y2="424" stroke="#1c1f2e" stroke-width="4" stroke-linecap="round"/><text x="104.0" y="415.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#1c1f2e" text-anchor="middle">Ctrl</text><text x="128" y="415" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">+</text><rect x="134" y="395" width="30" height="30" rx="7" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><line x1="136" y1="424" x2="162" y2="424" stroke="#1c1f2e" stroke-width="4" stroke-linecap="round"/><text x="149.0" y="415.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#1c1f2e" text-anchor="middle">S</text><text x="60" y="445" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#1c1f2e" text-anchor="start">сохранить, почаще</text></svg>