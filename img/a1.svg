<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="840" height="430" fill="#fff"/><rect x="30" y="30" width="520" height="330" rx="12" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><path d="M42 30 h496 a12 12 0 0 1 12 12 v22 h-520 v-22 a12 12 0 0 1 12 -12z" fill="#9333ea"/><line x1="30" y1="64" x2="550" y2="64" stroke="#1c1f2e" stroke-width="2" stroke-linecap="round"/><text x="44" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Чат с ИИ-помощником</text><text x="472" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">—</text><text x="500" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">▢</text><text x="528" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">✕</text><rect x="230" y="60" width="300" height="46" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="244" y="86" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Почему небо голубое?</text><rect x="50" y="120" width="420" height="96" rx="14" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><text x="64" y="146" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Солнечный свет состоит из разных цветов.</text><text x="64" y="166" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Воздух сильнее всего рассеивает голубой —</text><text x="64" y="186" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">поэтому небо кажется голубым.</text><rect x="230" y="232" width="300" height="46" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="244" y="258" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">А сколько лет моей кошке?</text><rect x="50" y="292" width="420" height="52" rx="14" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><text x="64" y="318" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c1f2e" text-anchor="start">Этого я знать не могу: я тебя не знаю.</text><rect x="600" y="82.0" width="84.0" height="64.8" rx="12" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><line x1="642.0" y1="70" x2="642.0" y2="82.0" stroke="#1c1f2e" stroke-width="2" stroke-linecap="round"/><circle cx="642.0" cy="70" r="6.0" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><circle cx="626.4" cy="110.8" r="7.199999999999999" fill="#fff"/><circle cx="657.6" cy="110.8" r="7.199999999999999" fill="#fff"/><line x1="628.8" y1="130.0" x2="655.2" y2="130.0" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="600" cy="200" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="600" y="205" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">1</text><text x="622" y="205" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Отвечает словами</text><circle cx="600" cy="250" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="600" y="255" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">2</text><text x="622" y="255" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Не человек: не думает</text><text x="622" y="275" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">и не чувствует</text><circle cx="600" cy="320" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="600" y="325" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">3</text><text x="622" y="325" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Не знает тебя лично</text><text x="30" y="400" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a8f9e" text-anchor="start">ИИ прочитал огромное количество текстов и подбирает подходящие слова. Иногда — неправильные.</text></svg>