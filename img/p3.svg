<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="800" height="480" fill="#fff"/><rect x="0" y="0" width="800" height="480" rx="0" fill="#1c1f2e" stroke="none" stroke-width="0"/><rect x="40" y="30" width="720" height="300" rx="6" fill="#fff" stroke="#fff" stroke-width="2"/><text x="400" y="170" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" fill="#1c1f2e" text-anchor="middle">Спасибо за внимание!</text><text x="400" y="215" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#8a8f9e" text-anchor="middle">Есть вопросы?</text><rect x="50" y="370" width="60" height="40" rx="7" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><line x1="52" y1="409" x2="108" y2="409" stroke="#1c1f2e" stroke-width="4" stroke-linecap="round"/><text x="80.0" y="395.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1c1f2e" text-anchor="middle">F5</text><text x="80" y="440" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">запустить</text><text x="80" y="458" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">с начала</text><rect x="170" y="370" width="130" height="40" rx="7" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><line x1="172" y1="409" x2="298" y2="409" stroke="#1c1f2e" stroke-width="4" stroke-linecap="round"/><text x="235.0" y="395.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1c1f2e" text-anchor="middle">Пробел</text><text x="235" y="440" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"