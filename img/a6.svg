<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="840" height="440" fill="#fff"/><text x="30" y="34" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#1c1f2e" text-anchor="start">Рутину — помощнику, интересное — себе</text><rect x="30" y="56" width="300" height="300" rx="14" fill="#f3f4f8" stroke="#dfe3ee" stroke-width="2"/><text x="50" y="88" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#8a8f9e" text-anchor="start">Скучное и повторяющееся</text><rect x="50" y="108" width="260" height="36" rx="9" fill="#fff" stroke="#dfe3ee" stroke-width="2"/><text x="66" y="132" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="start">• переписать начисто</text><rect x="50" y="154" width="260" height="36" rx="9" fill="#fff" stroke="#dfe3ee" stroke-width="2"/><text x="66" y="178" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="start">• найти опечатки</text><rect x="50" y="200" width="260" height="36" rx="9" fill="#fff" stroke="#dfe3ee" stroke-width="2"/><text x="66" y="224" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="start">• составить план</text><rect x="50" y="246" width="260" height="36" rx="9" fill="#fff" stroke="#dfe3ee" stroke-width="2"/><text x="66" y="270" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="start">• придумать 10 идей</text><rect x="50" y="292" width="260" height="36" rx="9" fill="#fff" stroke="#dfe3ee" stroke-width="2"/><text x="66" y="316" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="start">• сделать таблицу из списка</text><rect x="378" y="161.0" width="77.0" height="59.400000000000006" rx="12" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><line x1="416.5" y1="150" x2="416.5" y2="161.0" stroke="#1c1f2e" stroke-width="2" stroke-linecap="round"/><circle cx="416.5" cy="150" r="5.5" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><circle cx="402.2" cy="187.4" r="6.6000000000000005" fill="#fff"/><circle cx="430.8" cy="187.4" r="6.6000000000000005" fill="#fff"/><line x1="404.4" y1="205.0" x2="428.6" y2="205.0" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M350 190 L372 190" stroke="#1c1f2e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M372 190 L361.5 195.8 L361.5 184.2z" fill="#1c1f2e"/><path d="M462 190 L496 190" stroke="#1c1f2e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M496 190 L485.5 195.8 L485.5 184.2z" fill="#1c1f2e"/><rect x="510" y="56" width="300" height="300" rx="14" fill="#f4fbf6" stroke="#16a34a" stroke-width="3"/><text x="530" y="88" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#16a34a" text-anchor="start">Освободилось время</text><text x="530" y="130" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="400" fill="#1c1f2e" text-anchor="start">⏱</text><text x="570" y="132" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1c1f2e" text-anchor="start">на то, что интересно</text><text x="530" y="176" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">✓ разобраться, как это работает</text><text x="530" y="210" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">✓ придумать своё</text><text x="530" y="244" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">✓ погулять и поиграть</text><text x="530" y="278" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1c1f2e" text-anchor="start">✓ дочитать книгу</text><text x="530" y="330" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a" text-anchor="start">Это и называется автоматизацией</text><text x="30" y="392" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a8f9e" text-anchor="start">Помощник не устаёт и не обижается: можно переспрашивать сколько угодно, пока не станет понятно.</text><text x="30" y="414" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a8f9e" text-anchor="start">Решение всё равно за тобой: ты проверяешь и выбираешь, что оставить.</text></svg>