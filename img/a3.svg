<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1c1f2e"/></marker></defs><rect width="840" height="430" fill="#fff"/><rect x="30" y="30" width="460" height="250" rx="12" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><path d="M42 30 h436 a12 12 0 0 1 12 12 v22 h-460 v-22 a12 12 0 0 1 12 -12z" fill="#9333ea"/><line x1="30" y1="64" x2="490" y2="64" stroke="#1c1f2e" stroke-width="2" stroke-linecap="round"/><text x="44" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Чат с ИИ-помощником</text><text x="412" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">—</text><text x="440" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">▢</text><text x="468" y="53" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">✕</text><rect x="60" y="60" width="400" height="42" rx="14" fill="#9333ea" stroke="#1c1f2e" stroke-width="2"/><text x="74" y="86" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Кто написал «Му-му»?</text><rect x="60" y="116" width="400" height="46" rx="14" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><text x="74" y="142" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1f2e" text-anchor="start">«Му-му» написал Лев Толстой.</text><rect x="60" y="178" width="400" height="74" rx="10" fill="#fdeeee" stroke="#d94848" stroke-width="2"/><text x="80" y="206" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d94848" text-anchor="start">⚠ Это неправда: написал Тургенев.</text><text x="80" y="230" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8f9e" text-anchor="start">ИИ ошибся, но говорил уверенно.</text><circle cx="540" cy="90" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="95" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">1</text><text x="562" y="95" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Проверь в учебнике</text><circle cx="540" cy="150" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="155" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">2</text><text x="562" y="155" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Поищи на надёжном сайте</text><circle cx="540" cy="210" r="15" fill="#ffd84d" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="215" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="middle">3</text><text x="562" y="215" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1c1f2e" text-anchor="start">Спроси взрослого</text><rect x="520" y="250" width="290" height="120" rx="12" fill="#fff" stroke="#1c1f2e" stroke-width="2"/><text x="540" y="282" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#1c1f2e" text-anchor="start">Особенно проверяй:</text><text x="556" y="308" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8f9e" text-anchor="start">• даты и числа</text><text x="556" y="330" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8f9e" text-anchor="start">• имена и фамилии</text><text x="556" y="352" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8f9e" text-anchor="start">• правила и формулы</text><text x="30" y="320" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1c1f2e" text-anchor="start">Уверенный тон — не доказательство.</text><text x="30" y="348" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8f9e" text-anchor="start">Если ИИ спорит и настаивает, он всё равно</text><text x="30" y="368" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#8a8f9e" text-anchor="start">может ошибаться. Верь проверке, а не тону.</text><text x="30" y="412" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#8a8f9e" text-anchor="start">Выдуманный ответ, который звучит правдоподобно, — обычное дело для ИИ.</text></svg>