<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Итоговый тест</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header></header>
<main>
<h1>Итоговый тест</h1>
<p class="lead">Двенадцать вопросов из всех шести миров. Проходить можно сколько угодно раз. Прогресс уроков тест не меняет.</p>
</main>

<script src="lessons.js"></script>
<script>
  window.EXAM = {
    title: 'Итоговый тест',
    badge: 'Итоговый тест · 12 вопросов',
    heading: 'Всё, что мы прошли',
    questions: [
      { section: 'win', q: 'Что показывает панель задач справа?', a: ['Только обои рабочего стола', 'Часы, дату, громкость и Wi-Fi', 'Все файлы компьютера'], right: 1 },
      { section: 'win', q: 'Как переключиться между открытыми окнами?', a: ['Перезагрузить компьютер', 'Alt + Tab или клик по значку на панели задач', 'Нажать Esc'], right: 1 },
      { section: 'win', q: 'Что делает Ctrl + Z?', a: ['Отменяет последнее действие', 'Копирует файл', 'Закрывает программу'], right: 0 },
      { section: 'win', q: 'В игре незнакомец спрашивает, в какой ты школе. Что делать?', a: ['Ответить, это же не секрет', 'Не отвечать и рассказать родителям', 'Дать номер телефона'], right: 1 },
      { section: 'word', q: 'Чем список отличается от обычного текста в Word?', a: ['Каждый пункт с новой строки со значком или номером', 'Он всегда жирный', 'Он не печатается'], right: 0 },
      { section: 'word', q: 'Что делает Ctrl + S в Word?', a: ['Сохраняет документ', 'Вставляет картинку', 'Печатает страницу'], right: 0 },
      { section: 'excel', q: 'Что посчитает формула =СУММ(A1:A5)?', a: ['Сумму пяти ячеек от A1 до A5', 'Количество букв', 'Среднее по всей таблице'], right: 0 },
      { section: 'excel', q: 'Зачем в Excel нужна диаграмма?', a: ['Чтобы числа было видно наглядно', 'Чтобы таблица считала быстрее', 'Чтобы защитить файл'], right: 0 },
      { section: 'ppt', q: 'Как выйти из показа презентации?', a: ['Выключить компьютер', 'Нажать Esc', 'Нажать Пробел'], right: 1 },
      { section: 'outlook', q: 'Что такое папка «Входящие»?', a: ['Письма, которые пришли тебе', 'Письма, которые ты отправил', 'Удалённые письма'], right: 0 },
      { section: 'ai', q: 'ИИ уверенно назвал дату. Что с ней делать?', a: ['Сразу записать в тетрадь', 'Проверить в учебнике или у взрослых', 'Поверить, раз он уверен'], right: 1 },
      { section: 'ai', q: 'Какая просьба к ИИ помогает научиться?', a: ['«Напиши за меня сочинение»', '«Объясни, как решать, и приведи пример»', '«Сделай всю домашку»'], right: 1 }
    ],
    levels: [
      { min: 0, title: 'Ещё есть что повторить', text: 'Вернись к мирам, где были ошибки, и пройди тесты уроков заново.' },
      { min: 0.67, title: 'Хороший результат', text: 'Ты помнишь почти всё. Повтори пару тем, где ошибся, и приходи снова.' },
      { min: 0.92, title: 'Мастер компьютера!', text: 'Отличный результат: ты уверенно помнишь все шесть миров.' }
    ],
    advice(weakest, count) {
      const byId = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
      const weakNames = weakest.map(id => byId[id] && byId[id].title).filter(Boolean);
      const done = getDone();
      const notDone = LESSONS.filter(l => !done.includes(l.id));
      return (weakNames.length
          ? `<p>Повтори миры: <b>${weakNames.join(', ')}</b>.</p>`
          : `<p>Ни одной ошибки — ${count} из ${this.questions.length}. Это высший результат.</p>`) +
        (notDone.length
          ? `<p>Не пройдено уроков: ${notDone.length}. <a href="lessons/${notDone[0].id}.html">Продолжить: ${notDone[0].title}</a></p>`
          : '<p>Все уроки пройдены, кубок «Мастер компьютера» уже твой. <a href="index.html#awards">Посмотреть награды</a></p>');
    }
  };
</script>
<script src="exam.js"></script>
</body>
</html>
